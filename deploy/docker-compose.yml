# CEMS backend stack for a single EC2 instance (t4g.small, arm64).
#
# Two containers on a private bridge network. Neither publishes a port to the outside world:
# the API binds only to 127.0.0.1:8080 so nginx on the host is the sole public entrypoint, and
# Postgres is not published at all — it is reachable only from the API container.
#
# Run from this directory:  docker compose up -d
# Managed in production by: systemctl start cems (see cems.service)

name: cems

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cems}
      POSTGRES_USER: ${POSTGRES_USER:-cems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Fixed collation/encoding so a dump taken here restores predictably elsewhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Without the explicit -U, pg_isready checks the "root" role and fails.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cems} -d ${POSTGRES_DB:-cems}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Postgres shares 2 GiB with the JVM, nginx, and the OS, so cap it rather than letting the
    # default cache settings assume the whole machine. shared_buffers stays at ~25% of the
    # container limit, which is the conventional ratio.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=50
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: cems-api:latest
    build:
      # Build context is the api/api project root, one level up from deploy/.
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Service name "db" resolves on the compose network; the database is never exposed to the host.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cems}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cems}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS must be set in .env}
      APP_FRONTEND_RESET_PASSWORD_URL: ${APP_FRONTEND_RESET_PASSWORD_URL:?APP_FRONTEND_RESET_PASSWORD_URL must be set in .env}
      APP_RECAPTCHA_ENABLED: ${APP_RECAPTCHA_ENABLED:-true}
      APP_RECAPTCHA_SITE_SECRET: ${APP_RECAPTCHA_SITE_SECRET:-}
      # Set for the first boot only, then removed from .env once the admin exists.
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      # Uploads and generated reports on the host EBS volume, so replacing the container
      # (or rebuilding the image) never destroys them. EBS snapshots cover this path.
      - /var/lib/cems/storage:/var/lib/cems/storage
    ports:
      # Loopback only. Exposing 0.0.0.0:8080 here would bypass nginx and TLS entirely,
      # and the EC2 security group would be the only thing standing in front of it.
      - "127.0.0.1:8080:8080"
    # 900M against MaxRAMPercentage=60 gives the JVM a ~540M heap. Together with the database's
    # 512M this leaves roughly 600M of the instance's 2 GiB for nginx, the OS, and page cache.
    deploy:
      resources:
        limits:
          memory: 900M

volumes:
  db-data:
