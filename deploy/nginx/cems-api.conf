# nginx site for the CEMS API.
#
# Install:
#   sudo cp deploy/nginx/cems-api.conf /etc/nginx/sites-available/cems-api
#   sudo ln -s /etc/nginx/sites-available/cems-api /etc/nginx/sites-enabled/cems-api
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.example.com with your API hostname before installing.
#
# IMPORTANT: obtain the certificate BEFORE enabling this site. nginx refuses to start a
# `listen ... ssl` server whose ssl_certificate file does not exist yet, so installing this
# first would take nginx down. AWS_DEPLOYMENT.md issues the certificate against the default
# site, then swaps this one in.

upstream cems_api {
    # The API container publishes on loopback only.
    server 127.0.0.1:8080;
    keepalive 16;
}

# Plain HTTP: serve only the ACME challenge, redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;

    # HTTP/2 is optional here and the directive differs by version: nginx 1.25.1+ wants a
    # separate `http2 on;` line, while 1.24 (what Ubuntu 24.04 ships) only accepts it as a
    # `listen ... ssl http2` parameter and errors out on the standalone form. Left off so this
    # file loads on either. Add the form matching your `nginx -v` if you want it.

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Spelled out rather than `include /etc/letsencrypt/options-ssl-nginx.conf`: that file is
    # written by certbot's nginx *installer*, and this deployment uses `certonly --webroot`,
    # which does not create it. Including a missing file stops nginx from starting.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Uploads are capped at 10 MB by the application. nginx must allow slightly more so the
    # size error comes from the API with a proper JSON body, rather than nginx returning a
    # bare 413 that the frontend cannot parse. Keep in step with
    # spring.servlet.multipart.max-request-size.
    client_max_body_size 12m;

    # Report generation (POI .docx/.xlsx) can run long on a small instance.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # HSTS. Only safe once TLS is confirmed working — a bad cert with this header set locks
    # browsers out of the host for max-age.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://cems_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The application reads the first hop of
        # X-Forwarded-For to rate-limit public survey submissions and login attempts; appending
        # would let a client send its own X-Forwarded-For and land a forged value in that first
        # position, defeating the limit. Overwriting makes the header trustworthy.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # Health endpoint stays internal: it is for local checks and monitoring, not the public.
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cems_api;
        proxy_set_header Host $host;
    }
}
