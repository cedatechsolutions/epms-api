spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Sized for a single small instance. Postgres allows 100 connections by default, so a pool of 10
# leaves ample headroom for psql sessions and the nightly pg_dump while the API is running.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.h2.console.enabled=false

app.seed.enabled=false
app.seed.sync-bootstrap-users=false

# One-shot admin bootstrap for an empty database. Both values must be supplied for the account to
# be created; leave them unset once the admin exists so the app never touches the account again.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.recaptcha.enabled=${APP_RECAPTCHA_ENABLED:true}
app.recaptcha.site-secret=${APP_RECAPTCHA_SITE_SECRET}

jwt.secret=${JWT_SECRET}
