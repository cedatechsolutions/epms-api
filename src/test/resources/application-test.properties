app.recaptcha.enabled=false
# Effectively disable rate limiting in functional tests (they hammer one IP). The limiter's own
# behaviour is covered directly by IpRateLimiterTest.
app.auth.rate-limit-per-minute=100000
app.public.survey-rate-limit-per-minute=100000
# Keep uploaded test files out of the project tree.
app.storage.local.base-path=${java.io.tmpdir}/cems-test-storage
jwt.secret=test_only_jwt_secret_please_replace_with_a_long_random_value_for_tests_1234567890

spring.datasource.url=jdbc:h2:mem:cemsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
